[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nblaunch"
version = "0.1.0"
description = "nblaunch service scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
executionEnvironments = [
  { root = "tests", extraPaths = ["src"] },
  { root = "src" }
]
